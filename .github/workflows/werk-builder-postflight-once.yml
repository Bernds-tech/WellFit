name: WERK Builder Postflight Once

on:
  push:
    branches:
      - werk-v49-preview-host
    paths:
      - 'project-memory/werk-builder-postflight.trigger'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare bounded Builder postflight
        run: python scripts/werk-builder-postflight-once.py
      - name: Commit Builder-owned registers and claim
        run: |
          rm -f project-memory/werk-builder-postflight.trigger
          git config user.name "WERK Builder"
          git config user.email "actions@users.noreply.github.com"
          git add project-memory/TASK_LEDGER.md \
                  project-memory/STARTED_WORK.md \
                  project-memory/WORK_LOCKS.md \
                  project-memory/DEPENDENCIES.md \
                  project-memory/OPEN_LOOPS.md \
                  project-memory/NEXT_BEST_ACTION.md \
                  werk-data/werk-system-graph.json \
                  project-memory/werk-builder-claims/WERK_IMPACT_FEEDBACK_SELECTION_2026-09-21T183500Z.json \
                  project-memory/werk-builder-postflight.trigger
          git diff --cached --check
          git commit -m "WERK: reconcile impact feedback selection claim"
          git push origin HEAD:werk-v49-preview-host
