name: WERK impact bridge reconcile script once
on:
  push:
    branches: [werk-v49-preview-host]
    paths: ['.github/workflows/werk-impact-bridge-reconcile-script-once.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: werk-v49-preview-host
          fetch-depth: 0
      - name: Reconcile staged Impact Bridge claim
        run: |
          python scripts/werk-impact-bridge-reconcile-v2.py
          python - <<'PY'
          from pathlib import Path
          for f in ['werk-data/ideenwerk-api-contract.json','werk-data/werk-system-graph.json','project-memory/STARTED_WORK.md','project-memory/WORK_LOCKS.md','project-memory/TASK_LEDGER.md','project-memory/OPEN_LOOPS.md','project-memory/DEPENDENCIES.md','project-memory/NEXT_BEST_ACTION.md']:
              p=Path(f); p.write_text(p.read_text().rstrip()+'\n')
          PY
          git diff --check
          git config user.name 'werk-autonomous-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add werk-data/ideenwerk-api-contract.json werk-data/werk-system-graph.json project-memory/STARTED_WORK.md project-memory/WORK_LOCKS.md project-memory/TASK_LEDGER.md project-memory/OPEN_LOOPS.md project-memory/DEPENDENCIES.md project-memory/NEXT_BEST_ACTION.md
          git diff --cached --quiet && exit 0
          git commit -m 'reconcile: record staged IDEENWERK impact bridge state'
          git push origin HEAD:werk-v49-preview-host
