name: WERK Identity Architecture Check
on:
  push:
    branches: [werk-v49-preview-host]
    paths:
      - 'werk-data/verified-support-identity-architecture.json'
      - 'werk-data/werk-system-graph.json'
      - 'scripts/werk-identity-architecture-contract.mjs'
      - '.github/workflows/werk-identity-architecture-check.yml'
      - 'werk-data/data-contract-registry.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/werk-identity-architecture-contract.mjs
      - run: node scripts/werk-identity-architecture-contract.mjs
