name: WERK Verified Support Core Check
on:
  push:
    branches: [werk-v49-preview-host]
    paths:
      - 'werk-data/verified-support-core.json'
      - 'werk-data/verified-support-identity-architecture.json'
      - 'ideenwerk-backend/sql/047_verified_support_core.sql'
      - 'ideenwerk-backend/scripts/verified-support-core-smoke.mjs'
      - 'scripts/werk-verified-support-core-contract.mjs'
      - '.github/workflows/werk-verified-support-core-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: werk
          POSTGRES_USER: werk
          POSTGRES_PASSWORD: werk-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U werk -d werk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://werk:werk-ci-only@127.0.0.1:5432/werk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: ideenwerk-backend
      - name: Bootstrap portable roles/extensions
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticator') THEN CREATE ROLE authenticator NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='postgres') THEN CREATE ROLE postgres NOLOGIN; END IF;
          END $$;
          CREATE SCHEMA IF NOT EXISTS extensions;
          CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
          CREATE TABLE IF NOT EXISTS public.ideenwerk_runtime_meta (
            key text PRIMARY KEY,
            value text NOT NULL,
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          SQL
          rm -rf /tmp/ideenwerk-support-core-ci && mkdir -p /tmp/ideenwerk-support-core-ci
          for f in ideenwerk-backend/sql/*.sql; do
            b="$(basename "$f")"
            case "$b" in 016_*|017_*|018_*|020_*|021_*|022_*) ;; *) cp "$f" /tmp/ideenwerk-support-core-ci/ ;; esac
          done
          cat > /tmp/ideenwerk-support-core-ci/016_pg_net_internal_only.sql <<'SQL'
          SELECT 1;
          SQL
          test -s /tmp/ideenwerk-support-core-ci/047_verified_support_core.sql
      - run: node --check scripts/werk-verified-support-core-contract.mjs
      - run: node scripts/werk-verified-support-core-contract.mjs
      - run: SQL_DIR=/tmp/ideenwerk-support-core-ci npm run migrate
        working-directory: ideenwerk-backend
      - run: SQL_DIR=/tmp/ideenwerk-support-core-ci npm run migrate
        working-directory: ideenwerk-backend
      - run: node scripts/verified-support-core-smoke.mjs
        working-directory: ideenwerk-backend
