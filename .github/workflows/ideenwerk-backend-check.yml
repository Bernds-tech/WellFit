name: IDEENWERK Backend Check

on:
  push:
    branches:
      - werk-v49-preview-host
    paths:
      - 'ideenwerk-backend/**'
      - '.github/workflows/ideenwerk-backend-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: werk
          POSTGRES_USER: werk
          POSTGRES_PASSWORD: werk-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U werk -d werk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://werk:werk-ci-only@127.0.0.1:5432/werk
      RESTORE_DATABASE_URL: postgres://werk:werk-ci-only@127.0.0.1:5432/werk_restore
      IDEENWERK_BASE_URL: http://127.0.0.1:8787
      PORT: 8787
      ALLOWED_ORIGINS: http://127.0.0.1:8080
      TRUST_PROXY: "false"
      DISTRIBUTED_RATE_LIMIT: "true"
      REQUIRE_DISTRIBUTED_RATE_LIMIT: "true"
      ABUSE_HASH_SECRET: "werk-ci-only-0123456789abcdef0123456789abcdef"
      RETENTION_DRY_RUN: "true"
      RETENTION_POLICY_VERSION: 2026-09-03-v1
    defaults:
      run:
        working-directory: ideenwerk-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap Supabase-compatible CI database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN
              CREATE ROLE service_role NOLOGIN;
            END IF;
          END
          $$;
          CREATE SCHEMA IF NOT EXISTS extensions;
          SQL

          # 001-015 and 019 are portable PostgreSQL backend migrations. 016-018
          # are Supabase-staging contracts that depend on pg_net/pg_cron and are
          # verified on the real WERK staging project rather than emulated here.
          test -s sql/016_internal_pg_net.sql
          test -s sql/017_edge_intake_status.sql
          test -s sql/018_staging_db_worker.sql
          test -s sql/019_cluster_candidate_pair_dedup.sql
          mkdir -p /tmp/ideenwerk-ci-sql
          cp sql/0{01..15}_*.sql /tmp/ideenwerk-ci-sql/
          cp sql/019_cluster_candidate_pair_dedup.sql /tmp/ideenwerk-ci-sql/

          # src/app.js currently uses this readiness marker for the portable
          # backend. Generate it only inside the disposable CI database; this
          # never changes or substitutes the real Supabase migration 016.
          cat > /tmp/ideenwerk-ci-sql/016_pg_net_internal_only.sql <<'SQL'
          -- CI-only readiness marker; real staging uses 016_internal_pg_net.sql.
          SELECT 1;
          SQL

      - name: Syntax check
        run: |
          node --check src/app.js
          node --check src/worker.js
          node --check src/lib/status-token.js
          node --check src/lib/status-machine.js
          node --check src/lib/triage.js
          node --check src/lib/cluster-decision.js
          node --check src/lib/semantic-provider.js
          node --check src/lib/lexical-policy.js
          node --check src/lib/abuse-subject.js
          node --check scripts/migrate.mjs
          node --check scripts/retention-maintenance.mjs
          node --check scripts/backup.mjs
          node --check scripts/restore-verify.mjs
          node --check scripts/smoke.mjs
          node --check scripts/staging-edge-e2e.mjs
          node --check scripts/operator-guardrails-smoke.mjs
          node --check scripts/distributed-rate-limit-smoke.mjs
          node --check scripts/seed-synthetic.mjs
          node --check scripts/benchmark-queue.mjs
          node --check scripts/cleanup-synthetic.mjs
          node --check scripts/evaluate-clustering.mjs

      - name: Unit tests
        run: npm test

      - name: Apply migrations
        run: SQL_DIR=/tmp/ideenwerk-ci-sql npm run migrate

      - name: Migration idempotency check
        run: SQL_DIR=/tmp/ideenwerk-ci-sql npm run migrate

      - name: Operator/cluster DB guardrails
        run: npm run guardrails:operator

      - name: Distributed rate-limit DB guardrail
        run: npm run guardrails:rate

      - name: Start API and worker
        run: |
          npm start > /tmp/ideenwerk-api.log 2>&1 &
          echo $! > /tmp/ideenwerk-api.pid
          npm run worker > /tmp/ideenwerk-worker.log 2>&1 &
          echo $! > /tmp/ideenwerk-worker.pid

      - name: Wait for readiness
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          echo 'API did not become ready'
          cat /tmp/ideenwerk-api.log || true
          exit 1

      - name: No-login API/privacy smoke test
        run: npm run smoke

      - name: Retention dry-run
        run: npm run retention:run

      - name: Backup database
        run: |
          mkdir -p /tmp/ideenwerk-backups
          BACKUP_DIR=/tmp/ideenwerk-backups npm run backup
          echo "BACKUP_FILE=$(find /tmp/ideenwerk-backups -name '*.dump' | head -n1)" >> "$GITHUB_ENV"

      - name: Create isolated restore database
        run: PGPASSWORD=werk-ci-only psql -h 127.0.0.1 -U werk -d postgres -c 'CREATE DATABASE werk_restore;'

      - name: Restore and verify backup
        env:
          RESTORE_CONFIRM: I_UNDERSTAND_TEST_RESTORE
        run: npm run restore:verify

      - name: Clustering goldset diagnostic
        run: npm run eval:cluster

      - name: Small queue integration load
        env:
          SYNTHETIC_RUN_ID: CI1K-${{ github.run_id }}
          SYNTHETIC_COUNT: 1000
          SYNTHETIC_BATCH: 250
          BENCHMARK_MAX_SECONDS: 120
          BENCHMARK_INTERVAL_MS: 1000
        run: |
          npm run load:seed
          npm run load:benchmark
          npm run load:cleanup

      - name: Show service logs on failure
        if: failure()
        run: |
          echo '--- API LOG ---'
          cat /tmp/ideenwerk-api.log || true
          echo '--- WORKER LOG ---'
          cat /tmp/ideenwerk-worker.log || true
