name: Project Memory Guard

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-memory-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate project-memory structure
        shell: bash
        run: |
          set -euo pipefail
          for file in project-memory/{PROTOCOL,CURRENT_STATE,TASK_LEDGER,CHANGE_REQUESTS,DECISIONS,FAILED_ATTEMPTS}.md; do
            test -s "$file" || { echo "Missing or empty required project-memory file: $file"; exit 1; }
          done
      - name: Require memory update for meaningful PR changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          meaningful=0; memory_changed=0
          while IFS= read -r file; do
            test -n "$file" || continue
            case "$file" in
              project-memory/*) memory_changed=1 ;;
              .github/workflows/project-memory-guard.yml) ;;
              *) meaningful=1 ;;
            esac
          done <<< "$changed"
          if [[ "$meaningful" -eq 1 && "$memory_changed" -ne 1 ]]; then
            echo "Meaningful repository changes require a project-memory update."
            exit 1
          fi
      - name: Detect duplicate primary memory IDs
        shell: bash
        run: |
          set -euo pipefail
          ids="$(grep -hE '^## [A-Z][A-Z0-9-]+$' project-memory/{TASK_LEDGER,CHANGE_REQUESTS,DECISIONS,FAILED_ATTEMPTS}.md | sed 's/^## //' || true)"
          duplicates="$(printf '%s\n' "$ids" | sed '/^$/d' | sort | uniq -d)"
          if [[ -n "$duplicates" ]]; then
            echo "Duplicate project-memory IDs detected:"
            printf '%s\n' "$duplicates"
            exit 1
          fi
