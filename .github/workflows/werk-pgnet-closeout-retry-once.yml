name: WERK pg_net closeout retry once

on:
  push:
    branches: [werk-v49-preview-host]
    paths:
      - '.github/workflows/werk-pgnet-closeout-retry-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: werk-v49-preview-host
          fetch-depth: 0
      - name: Re-run bounded reconciliation script and normalize EOF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/werk-pgnet-closeout-once.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          code = textwrap.dedent(source[start:end])
          exec(compile(code, 'werk-pgnet-closeout-script', 'exec'), {})

          paths = [
              'project-memory/TASK_LEDGER.md',
              'project-memory/STARTED_WORK.md',
              'project-memory/WORK_LOCKS.md',
              'project-memory/OPEN_LOOPS.md',
              'project-memory/CONTRADICTIONS.md',
              'project-memory/EXECUTION_RECEIPTS.md',
              'project-memory/WERK_PG_NET_SECURITY_001_BUILDER_CLAIM.md',
              'project-memory/NEXT_BEST_ACTION.md',
          ]
          for item in paths:
              p = Path(item)
              p.write_text(p.read_text().rstrip() + '\n')
          PY
      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name 'werk-autonomous-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add project-memory/TASK_LEDGER.md project-memory/STARTED_WORK.md project-memory/WORK_LOCKS.md project-memory/OPEN_LOOPS.md project-memory/CONTRADICTIONS.md project-memory/EXECUTION_RECEIPTS.md project-memory/WERK_PG_NET_SECURITY_001_BUILDER_CLAIM.md project-memory/NEXT_BEST_ACTION.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'reconcile: consume pg_net staging countercheck'
          git push origin HEAD:werk-v49-preview-host
