name: WERK Impact Builder Reconcile Once

on:
  push:
    branches:
      - werk-v49-preview-host
    paths:
      - '.github/workflows/werk-impact-builder-reconcile-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message != 'WERK: reconcile impact source binding builder state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: werk-v49-preview-host
          fetch-depth: 0
      - name: Reconcile builder-owned WERK state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          functional_head = 'ceea9a8bce350529114258049a93ba1057dacbeb'
          staging_migration = '20260921062817 werk_impact_authoritative_source_binding'
          claim_path = 'project-memory/WERK_IMPACT_SOURCE_BINDING_001_BUILDER_CLAIM.md'

          def replace_section(path, header, replacement):
              p = Path(path)
              text = p.read_text()
              pattern = re.compile(rf'(?ms)^{re.escape(header)}\n.*?(?=^## |\Z)')
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected exactly one section {header}, found {len(matches)}')
              new = text[:matches[0].start()] + replacement.rstrip() + '\n\n' + text[matches[0].end():].lstrip('\n')
              p.write_text(new)

          replace_section('project-memory/TASK_LEDGER.md','## WERK-IMPACT-001',f'''## WERK-IMPACT-001
          - Date: 2026-09-21
          - Status: IMPLEMENTED_NOT_VERIFIED
          - Risk: R3
          - Goal: source-bind forecast/baseline, real implementation evidence, KPI observations, arithmetic deviation, attribution hypotheses and review-only improvement hypotheses without inferring causality automatically.
          - Previously verified scope: migration 042, RLS/ACL, impact_reviewer gate, append-only evidence, observation source/period guards, baseline/target/observation separation, arithmetic deviation and no-causality/review-only semantics.
          - Builder reconciliation result: migration 043 now compiles the existing canonical `werk-data/ideenwerk-impact-bridge.json` into a fail-closed runtime validator; `werk_record_impact_measurement_plan` rejects unknown impact maps, map/reform mismatches, map/artifact mismatches and stale/unknown canonical source-version tokens before persistence or replay acceptance. No second registry or calculator was created.
          - Functional evidence: exact head `{functional_head}`; WERK Impact Measurement Check #6 SUCCESS; WERK Data Contract Registry Check #63 SUCCESS.
          - Staging evidence: migration `{staging_migration}` applied; valid `IMPACT-SV-EMPLOYEE / SV-01 / werk-data/employee-sv-funding-bridge-results.json` binding returned `current_authoritative_registry_tuple`; unknown map, reform mismatch, artifact mismatch and stale source version each failed closed; impact plans/implementations/observations/reviews remained zero-row.
          - Security boundary: fresh Security Advisor produced no new WARN from this change; the existing `pg_net extension_in_public` WARN remains a separate production-hardening loop.
          - Open contradiction: `CTR-WERK-IMPACT-SOURCE-BINDING-001` remains pending independent Supervisor reconciliation; Builder does not self-resolve it.
          - Open loop/lock: `WERK-LOOP-IMPACT-001` remains open awaiting countercheck and `LOCK-WERK-IMPACT-001` remains ACTIVE.
          - Exact next step: independent Supervisor countercheck of exact-head CI, live migration 043, fail-closed source tuple behavior and zero-baseline/security boundaries. Only after that may `WERK-DEP-IMPACT-FEEDBACK-001` advance.
          - Builder claim: `{claim_path}`.
          - Do not repeat: do not rebuild Impact Bridge, create a parallel source registry, alter formulas, infer causal effect, activate an AI provider or start downstream feedback integration before the independent countercheck.''')

          replace_section('project-memory/STARTED_WORK.md','## WERK-IMPACT-001',f'''## WERK-IMPACT-001
          - Started: 2026-09-21 06:33 Europe/Vienna
          - Status: IMPLEMENTED_NOT_VERIFIED
          - Risk: R3
          - Branch: `werk-v49-preview-host`
          - Scope: authoritative source-bound Soll/Ist measurement and review-only feedback contract separating forecast, implementation evidence, observation, arithmetic deviation and causal attribution hypothesis.
          - Implemented now: migration 043 validates the complete measurement-plan source tuple against the compiled current canonical Impact Bridge registry view before persistence/replay acceptance. Unknown/stale/mismatched tuples fail closed; no parallel registry/calculator was introduced.
          - Builder evidence: exact functional head `{functional_head}`; WERK Impact Measurement Check #6 and WERK Data Contract Registry Check #63 succeeded; Staging migration `{staging_migration}` is live; valid current binding plus four negative source-binding classes were verified; impact tables remained at zero rows.
          - Existing semantic boundary retained: baseline/forecast is not observed fact; observation is not causal attribution; arithmetic deviation is not policy effect; improvement remains review-only hypothesis.
          - Open contradiction: `CTR-WERK-IMPACT-SOURCE-BINDING-001` is not Builder-resolved; independent Supervisor countercheck is required.
          - Work lock: `LOCK-WERK-IMPACT-001` remains ACTIVE in `IMPLEMENTED_STAGING_AWAITING_COUNTERCHECK` phase.
          - Open loop: `WERK-LOOP-IMPACT-001` remains open awaiting countercheck.
          - Exact next step: Supervisor independently verifies the current runtime/CI/negative paths and either closes or rejects the source-binding reconciliation. No downstream feedback work before that.
          - Builder claim: `{claim_path}`.''')

          replace_section('project-memory/WORK_LOCKS.md','## LOCK-WERK-IMPACT-001',f'''## LOCK-WERK-IMPACT-001
          - Task: WERK-IMPACT-001
          - Status: ACTIVE
          - Phase: IMPLEMENTED_STAGING_AWAITING_COUNTERCHECK
          - Risk: R3
          - Holder: WERK autonomous builder / no second implementation worker
          - Branch: `werk-v49-preview-host`
          - Acquired: 2026-09-21 06:33 Europe/Vienna
          - Scope: source-bound measurement plan, implementation evidence, KPI observation and review-only attribution/improvement feedback contract on Staging.
          - Builder implementation evidence: exact functional head `{functional_head}`; WERK Impact Measurement Check #6 SUCCESS; Data Contract Registry Check #63 SUCCESS; migration `{staging_migration}` live; canonical valid tuple accepted; unknown map, reform mismatch, artifact mismatch and stale source token rejected; zero impact rows retained.
          - Source authority: existing `werk-data/ideenwerk-impact-bridge.json`; migration 043 is a compiled fail-closed validator view, not a second registry/calculator.
          - Boundary: no real-world implementation/effect claim, automatic causality, political change, provider activation or production action. Known pg_net extension placement remains separate production hardening.
          - Release condition: independent Supervisor countercheck confirms exact-head CI, live migration 043, source-binding negatives and staging/security baseline, and reconciles `CTR-WERK-IMPACT-SOURCE-BINDING-001`.
          - Builder claim: `{claim_path}`.''')

          replace_section('project-memory/OPEN_LOOPS.md','## WERK-LOOP-IMPACT-001',f'''## WERK-LOOP-IMPACT-001
          - Related: `WERK-IMPACT-001`, `WERK-DEP-IMPACT-FEEDBACK-001`, `CTR-WERK-IMPACT-SOURCE-BINDING-001`.
          - Status: OPEN_AWAITING_INDEPENDENT_COUNTERCHECK
          - Updated: 2026-09-21 Europe/Vienna
          - Risk: R3
          - Builder result: the previously observed authoritative source-binding gap is implemented on exact functional head `{functional_head}`. Migration 043 reuses the existing canonical Impact Bridge registry and makes measurement-plan creation fail closed for unknown impact maps, map/reform mismatch, map/artifact mismatch and stale/unknown canonical source-version tokens.
          - CI: WERK Impact Measurement Check #6 SUCCESS and WERK Data Contract Registry Check #63 SUCCESS on the exact functional head.
          - Staging: migration `{staging_migration}` live; current valid tuple accepted with `current_authoritative_registry_tuple`; all four negative source-binding classes rejected; measurement-plan/implementation/observation/review tables remain zero-row.
          - Security: fresh advisor introduced no new WARN; the unchanged `pg_net extension_in_public` WARN remains a separate production-hardening issue.
          - Boundary: no second registry/calculator, formula change, causal effect claim, political decision, provider activation or production action.
          - Required next step: independent Supervisor countercheck. Builder does not close this loop or resolve the contradiction itself.
          - Close when: Supervisor confirms exact-head CI plus live fail-closed staging behavior and reconciles `CTR-WERK-IMPACT-SOURCE-BINDING-001`; only then may `WERK-DEP-IMPACT-FEEDBACK-001` advance.
          - Builder claim: `{claim_path}`.''')

          replace_section('project-memory/DEPENDENCIES.md','## WERK-DEP-IMPACT-FEEDBACK-001',f'''## WERK-DEP-IMPACT-FEEDBACK-001
          - From: `IMPROVEMENT-LOOP` → `AI-SYNTHESIS` feedback edge.
          - Requires: independently counterchecked `WERK-IMPACT-001`, a bounded consumption contract that keeps attribution/improvement hypotheses distinct from facts, and—only for real model regeneration—an approved active AI provider boundary.
          - Type: cross-component feedback integration.
          - Status: ACTIVE
          - Updated: 2026-09-21 Europe/Vienna.
          - Current state: Builder implemented the missing authoritative source binding on exact functional head `{functional_head}` using migration 043 and the existing canonical Impact Bridge registry. WERK Impact Measurement Check #6 and Data Contract Registry Check #63 are green; Staging migration `{staging_migration}` is live; valid current tuple accepted and unknown/stale/mismatched tuples fail closed. Independent Supervisor countercheck is still required before the upstream task can be treated as counterchecked.
          - Rule: do not wire improvement-review hypotheses into AI until Supervisor closes the impact source-binding reconciliation. Once allowed, hypotheses remain provenance-bound and uncertainty-bearing and are never promoted to causal fact or automatic policy change.
          - Provider boundary: no provider activation is required merely to define a future consumption contract; real external regeneration remains separately blocked under `WERK-DEP-AI-PROVIDER-001`.
          - Builder claim: `{claim_path}`.''')

          nba = Path('project-memory/NEXT_BEST_ACTION.md')
          old = nba.read_text()
          marker = '\n---\n\n## Historical WellFit selector (not authoritative for WERK automation)'
          tail = ''
          if marker in old:
              tail = old.split(marker,1)[1]
          top = f'''# WERK Next Best Action

          - Project: `WERK Österreich`
          - Selected action: `WERK-IMPACT-001`
          - Status: `AWAITING_INDEPENDENT_COUNTERCHECK`
          - Risk: `R3`
          - Gate: `impact_measurement`
          - Title: Autoritative Wirkungsmessungs-Source-Bindung unabhängig gegenprüfen

          ## Why this action is selected
          The Builder has implemented the previously blocking YELLOW source-binding reconciliation without creating a parallel registry or calculator. Exact functional head `{functional_head}` passed WERK Impact Measurement Check #6 and Data Contract Registry Check #63. Staging migration `{staging_migration}` is live; the canonical current tuple is accepted and unknown map, map/reform mismatch, map/artifact mismatch and stale source version fail closed while all impact tables remain zero-row.

          Builder evidence is not independent acceptance. `CTR-WERK-IMPACT-SOURCE-BINDING-001`, `WERK-LOOP-IMPACT-001` and `LOCK-WERK-IMPACT-001` therefore remain open until the Supervisor independently rechecks the exact CI/runtime/security evidence.

          ## Exact next step
          1. Supervisor re-read exact functional head `{functional_head}` and WERK Impact Measurement Check #6 / Data Contract Registry #63.
          2. Independently verify live migration 043 and the valid current tuple plus unknown/stale/mismatched fail-closed paths.
          3. Recheck zero synthetic baseline and security/advisor state after the schema change.
          4. If evidence agrees, Supervisor reconciles the contradiction/freshness state; Builder then consumes the closeout and may advance `WERK-DEP-IMPACT-FEEDBACK-001`.

          ## Do not start yet
          - Do not implement `WERK-IMPACT-FEEDBACK-001` before independent countercheck.
          - Do not activate an external/paid AI provider.
          - Do not infer causal policy effect or political recommendation.
          - Do not reopen Impact Bridge, Expert Input or bounded provider-disabled AI synthesis.

          ## Known separate production-hardening item
          Hosted Supabase still reports `pg_net extension_in_public`; this remains separate from the impact source-binding correctness path and continues to block production-security acceptance.'''
          if tail:
              top += marker + tail
          nba.write_text(top.strip()+'\n')

          graph_path = Path('werk-data/werk-system-graph.json')
          graph = json.loads(graph_path.read_text())
          for node in graph['nodes']:
              if node['id']=='KPI-MEASUREMENT':
                  node['state']='IN_PROGRESS'
                  node['builder_state']='IMPLEMENTED_STAGING_AWAITING_COUNTERCHECK'
                  node['hardening']='ideenwerk-backend/sql/043_werk_impact_authoritative_source_binding.sql'
                  node['staging_source_binding_migration']=staging_migration
                  node['functional_head']=functional_head
                  node['ci']='WERK Impact Measurement Check #6 success; WERK Data Contract Registry Check #63 success'
                  node['open_contradiction']='CTR-WERK-IMPACT-SOURCE-BINDING-001 (pending independent Supervisor reconciliation)'
                  node['boundary']='baseline/forecast, implementation evidence, observation, arithmetic deviation and attribution hypothesis remain separated; authoritative map/reform/artifact/source-version binding is now Builder-implemented fail-closed but awaits independent countercheck.'
              elif node['id']=='IMPROVEMENT-LOOP':
                  node['builder_state']='BLOCKED_BEHIND_IMPACT_SOURCE_BINDING_COUNTERCHECK'
          for edge in graph['edges']:
              if edge['from']=='IDEENWERK-IMPACT' and edge['to']=='KPI-MEASUREMENT':
                  edge['state']='IN_PROGRESS'
                  edge['evidence']=f'Builder implemented fail-closed authoritative tuple binding in migration 043 at {functional_head}; Impact Measurement Check #6 and Data Contract Registry #63 green; Staging {staging_migration}; independent Supervisor countercheck pending.'
              elif edge['from']=='IMPROVEMENT-LOOP' and edge['to']=='AI-SYNTHESIS':
                  edge['state']='BLOCKED'
                  edge['evidence']='do not wire feedback consumption until independent Supervisor countercheck closes WERK-IMPACT-001 source-binding reconciliation; provider remains separately disabled'
          graph_path.write_text(json.dumps(graph,ensure_ascii=False,indent=2)+'\n')

          manifest_path = Path('werk-data/ideenwerk-impact-measurement.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['status']='implemented-staging-awaiting-independent-countercheck'
          manifest['runtime']['source_binding_staging_migration']=staging_migration
          manifest['runtime']['schema_verified']=True
          manifest['runtime']['zero_baseline']['measurement_plans']=0
          manifest['runtime']['zero_baseline']['implementation_events']=0
          manifest['runtime']['zero_baseline']['observations']=0
          manifest['runtime']['zero_baseline']['reviews']=0
          manifest['runtime']['security_advisor_new_warns']=0
          manifest['runtime']['security_advisor_observed_at']='2026-09-21T06:29:11Z'
          manifest['ci_evidence']['functional_head']=functional_head
          manifest['ci_evidence']['werk_impact_measurement_check_run']=6
          manifest['ci_evidence']['werk_impact_measurement_check']='success'
          manifest['ci_evidence']['data_contract_registry_check_run']=63
          manifest['ci_evidence']['data_contract_registry_check']='success'
          manifest['acceptance_boundary']='Builder evidence proves authoritative source-binding hardening on Staging only. Independent Supervisor countercheck remains required before COUNTERCHECKED_STAGING; no real reform implementation, observed causal policy effect, provider activation or Production claim is made.'
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')

          claim = f'''# WERK Impact Source Binding — Builder Claim

          - Task: `WERK-IMPACT-001`
          - Risk: R3
          - Status: `IMPLEMENTED_STAGING_AWAITING_INDEPENDENT_COUNTERCHECK`
          - Branch: `werk-v49-preview-host`
          - Exact functional head: `{functional_head}`
          - Scope: close `CTR-WERK-IMPACT-SOURCE-BINDING-001` Builder-side by binding measurement-plan creation to the existing canonical Impact Bridge/reform/artifact/version source chain.

          ## Implementation
          - Added `ideenwerk-backend/sql/043_werk_impact_authoritative_source_binding.sql`.
          - Added service-role-only `public.werk_impact_validate_source_binding(...)` as a compiled fail-closed view of `werk-data/ideenwerk-impact-bridge.json`; no second registry table or calculator was created.
          - `public.werk_record_impact_measurement_plan(...)` now validates map/reform/artifact/source-version before persistence or replay acceptance.
          - Current canonical source token: `impact-bridge=2026-09-21-v1;reforms=2026-09-06-v5;data-contract-registry=2026-09-07-v17`.
          - Rejection classes: `WERK_IMPACT_SOURCE_MAP_UNKNOWN`, `WERK_IMPACT_SOURCE_REFORM_MISMATCH`, `WERK_IMPACT_SOURCE_ARTIFACT_MISMATCH`, `WERK_IMPACT_SOURCE_VERSION_STALE_OR_UNKNOWN`.
          - CI parity guard requires every current canonical map/reform/artifact to exist in the compiled validator, so canonical registry drift fails closed until deliberately reconciled.

          ## Exact-head CI
          - WERK Impact Measurement Check #6: SUCCESS on `{functional_head}`.
          - WERK Data Contract Registry Check #63: SUCCESS on `{functional_head}`.
          - Covered: canonical registry/runtime parity, migration application/idempotency, unknown map, reform mismatch, artifact mismatch, stale source token, valid current tuple persistence/replay, reviewer boundary, observation guards, arithmetic deviation/no-causality semantics, review-only hypotheses and append-only denial.

          ## Reversible Staging Evidence
          - WERK Österreich Staging migration: `{staging_migration}`.
          - Valid tuple `IMPACT-SV-EMPLOYEE / SV-01 / werk-data/employee-sv-funding-bridge-results.json / current source token` returned `current_authoritative_registry_tuple`.
          - Live negative checks independently at the Builder execution layer rejected unknown map, reform mismatch, artifact mismatch and stale source token.
          - Zero baseline after verification: measurement plans 0; implementation events 0; observations 0; reviews 0.
          - Fresh Security Advisor after migration: no new WARN; unchanged separate WARN `pg_net extension_in_public`; RLS-without-policy findings remain INFO on deliberately RPC/direct-grant-bounded tables.

          ## Safety / Scope Boundary
          - No Production action.
          - No paid/external AI provider or secret activation.
          - No formula, fiscal effect or political weighting changed.
          - No real reform implementation or observed causal policy effect is claimed.
          - Existing Impact Bridge, Expert Input and bounded provider-disabled AI synthesis were not rebuilt.
          - Downstream `WERK-IMPACT-FEEDBACK-001` remains blocked until independent Supervisor countercheck.

          ## Required Independent Countercheck
          Supervisor must independently verify exact-head CI, live migration/function behavior, fail-closed negative classes, zero-baseline and post-schema security state, then reconcile `CTR-WERK-IMPACT-SOURCE-BINDING-001`, Evidence Freshness and Finishline state as appropriate. Builder does not self-accept or self-resolve the contradiction.
          '''
          Path(claim_path).write_text(re.sub(r'^          ','',claim,flags=re.M).strip()+'\n')

          # The one-shot workflow deletes itself in the reconciliation commit.
          Path('.github/workflows/werk-impact-builder-reconcile-once.yml').unlink()
          PY
          git config user.name 'WERK autonomous builder'
          git config user.email 'actions@users.noreply.github.com'
          git add project-memory/TASK_LEDGER.md project-memory/STARTED_WORK.md project-memory/WORK_LOCKS.md project-memory/OPEN_LOOPS.md project-memory/DEPENDENCIES.md project-memory/NEXT_BEST_ACTION.md project-memory/WERK_IMPACT_SOURCE_BINDING_001_BUILDER_CLAIM.md werk-data/werk-system-graph.json werk-data/ideenwerk-impact-measurement.json .github/workflows/werk-impact-builder-reconcile-once.yml
          git diff --cached --check
          git commit -m 'WERK: reconcile impact source binding builder state'
          git push origin HEAD:werk-v49-preview-host
