name: WERK impact bridge UI patch once
on:
  push:
    branches: [werk-v49-preview-host]
    paths: ['.github/workflows/werk-impact-bridge-ui-patch-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: werk-v49-preview-host
          fetch-depth: 0
      - name: Patch existing V71 status UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('werk-assets/site-ideenwerk-v2.js')
          t=p.read_text()
          if 'function impactBridgeHTML(' not in t:
              helper="function impactBridgeHTML(bridge){if(!bridge||typeof bridge!=='object')return'';if(bridge.result_code==='revalidation_required')return `<div class=\"iwNotice\"><b>WERK-Wirkungsbezug wird neu geprüft.</b> Eine frühere Zuordnung ist wegen einer Versionsänderung nicht mehr aktuell und wird deshalb nicht als geltender Bezug angezeigt.</div>`;if(bridge.result_code==='no_known_mapping')return `<div class=\"iwHint\"><b>WERK-Wirkungsbrücke:</b> Der automatische Vorcheck hat noch keinen hochspezifischen Bezug zu einer vorhandenen WERK-Reform/Rechnung gefunden. Das ist kein Beweis, dass kein Bezug existiert.</div>`;const maps=Array.isArray(bridge.mappings)?bridge.mappings:[];if(!maps.length)return'';return `<div class=\"iwRules\" style=\"margin-top:18px\"><div class=\"ey\">WERK-Wirkungsbrücke</div><h3>Vorhandene Reformen und Rechnungen werden wiederverwendet.</h3><p class=\"iwHint\">Diese Zuordnung erzeugt keine neue Wirkungszahl und keine politische Bewertung. Sie zeigt nur, welche bestehenden WERK-Prüfartefakte relevant sein können.</p><div class=\"iwLocalList\">${maps.map(m=>`<div class=\"iwLocalItem\"><b>${esc((m.reform_ids||[]).join(' · ')||m.map_id)}</b><small>Datenverträge: ${esc((m.data_contract_ids||[]).join(' · ')||'offen')} · Prüfgates: ${esc((m.gate_refs||[]).join(' · ')||'keine registriert')}</small></div>`).join('')}</div></div>`}\n"
              anchor='function downloadJson(id,data){'
              if anchor not in t: raise SystemExit('downloadJson anchor missing')
              t=t.replace(anchor,helper+anchor,1)
          old="privacyRequests=Array.isArray(s.privacy_requests)?s.privacy_requests:[];box.innerHTML=`"
          new="privacyRequests=Array.isArray(s.privacy_requests)?s.privacy_requests:[],impactBridge=s.impact_bridge_check&&typeof s.impact_bridge_check==='object'?s.impact_bridge_check:null;box.innerHTML=`"
          if 'impactBridge=s.impact_bridge_check' not in t:
              if old not in t: raise SystemExit('status binding anchor missing')
              t=t.replace(old,new,1)
          old2='Sie steuert nur den Umfang des Verfahrens und ist weder politische Bewertung noch Annahme/Ablehnung.</div>${pipelineHTML'
          new2='Sie steuert nur den Umfang des Verfahrens und ist weder politische Bewertung noch Annahme/Ablehnung.</div>${impactBridgeHTML(impactBridge)}${pipelineHTML'
          if '${impactBridgeHTML(impactBridge)}' not in t:
              if old2 not in t: raise SystemExit('status render anchor missing')
              t=t.replace(old2,new2,1)
          p.write_text(t)
          PY
          node --check werk-assets/site-ideenwerk-v2.js
          git diff --check
          git config user.name 'werk-autonomous-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add werk-assets/site-ideenwerk-v2.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: show existing WERK impact references in citizen status'
          git push origin HEAD:werk-v49-preview-host
