name: WERK Frontend Check

on:
  push:
    branches:
      - werk-v49-preview-host
    paths:
      - 'index.html'
      - 'werk-v*.html'
      - 'werk-assets/**'
      - 'werk-data/**'
      - '.github/workflows/werk-frontend-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find werk-assets -maxdepth 1 -type f -name '*.js' -print0 | sort -z)

      - name: JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          for (const name of fs.readdirSync('werk-data').filter(x => x.endsWith('.json')).sort()) {
            const p = path.join('werk-data', name);
            JSON.parse(fs.readFileSync(p, 'utf8'));
            console.log('JSON OK', p);
          }
          NODE

      - name: V71 structural and policy coverage contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const fail = msg => { throw new Error(msg); };
          const html = fs.readFileSync('werk-v71.html', 'utf8');
          const index = fs.readFileSync('index.html', 'utf8');
          const core = JSON.parse(fs.readFileSync('werk-data/core.json', 'utf8'));
          const map = JSON.parse(fs.readFileSync('werk-data/policy-field-map.json', 'utf8'));
          const master = JSON.parse(fs.readFileSync('werk-data/austria-analysis-master.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('werk-data/preview-manifest.json', 'utf8'));

          if (!html.includes('site-v71.css?v=20260905-v71')) fail('V71 CSS reference missing');
          if (!html.includes('site-v71-loader.js?v=20260905-v71')) fail('V71 loader reference missing');
          if (!html.includes('site-v71.js?v=20260905-v71')) fail('V71 renderer reference missing');
          if (!html.includes('id="policyFieldGrid"')) fail('policyFieldGrid missing');
          if (!index.includes('werk-v71.html?v=20260905-v71')) fail('Stable preview does not redirect to V71');

          if (!Array.isArray(core.pillars) || core.pillars.length !== 8) fail(`Expected 8 binding pillars, got ${core.pillars?.length}`);
          if (!Array.isArray(core.policy_fields) || core.policy_fields.length !== 12) fail(`Expected 12 policy fields, got ${core.policy_fields?.length}`);
          if (new Set(core.policy_fields.map(x => x.id)).size !== 12) fail('Policy field IDs are not unique');
          if (!Array.isArray(map.fields) || map.fields.length !== 12) fail(`Expected 12 policy mapping fields, got ${map.fields?.length}`);
          if (!Array.isArray(master.domains) || master.domains.length !== 41 || master.domains_total !== 41) fail(`Expected master universe 41, got ${master.domains?.length}/${master.domains_total}`);

          const coreById = new Map(core.policy_fields.map(x => [Number(x.id), x]));
          const mappedDomains = [];
          for (const field of map.fields) {
            const coreField = coreById.get(Number(field.id));
            if (!coreField) fail(`Mapped field ${field.id} missing from core`);
            if (coreField.name !== field.name) fail(`Policy field name mismatch at ${field.id}: ${coreField.name} != ${field.name}`);
            if (!Array.isArray(field.domains) || field.domains.length === 0) fail(`Mapped field ${field.id} has no domains`);
            mappedDomains.push(...field.domains);
          }
          const masterSet = new Set(master.domains);
          const counts = new Map();
          for (const domain of mappedDomains) counts.set(domain, (counts.get(domain) || 0) + 1);
          const missing = master.domains.filter(d => !counts.has(d));
          const unknown = [...counts.keys()].filter(d => !masterSet.has(d));
          const duplicates = [...counts.entries()].filter(([,n]) => n !== 1);
          if (mappedDomains.length !== 41) fail(`Expected exactly 41 mapped entries, got ${mappedDomains.length}`);
          if (missing.length) fail(`Unmapped master domains: ${missing.join(' | ')}`);
          if (unknown.length) fail(`Unknown mapped domains: ${unknown.join(' | ')}`);
          if (duplicates.length) fail(`Domains not mapped exactly once: ${duplicates.map(([d,n]) => `${d}=${n}`).join(' | ')}`);

          if (manifest.current_preview !== 'werk-v71.html') fail(`Manifest preview mismatch: ${manifest.current_preview}`);
          for (const item of manifest.required || []) {
            const p = String(item.path || '').replace(/^\.\//, '');
            if (!p || !fs.existsSync(p)) fail(`Manifest path missing: ${item.path}`);
          }
          console.log('V71 contract OK: 8 binding pillars, 12 policy fields, 41/41 master domains mapped exactly once, stable redirect and manifest paths valid');
          NODE

      - name: BUD-01 official baseline contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const fail = msg => { throw new Error(msg); };
          const b = JSON.parse(fs.readFileSync('werk-data/budget-baseline-2026-2031.json', 'utf8'));
          const p = JSON.parse(fs.readFileSync('werk-data/medium-term-fiscal-path.json', 'utf8'));
          const expectedYears = [2026,2027,2028,2029,2030,2031];
          if (JSON.stringify(b.years) !== JSON.stringify(expectedYears)) fail(`Baseline years mismatch: ${JSON.stringify(b.years)}`);
          if (b.status !== 'official-adopted-policy-baseline') fail(`Unexpected baseline status: ${b.status}`);
          const required = [
            'nominal_gdp_bn','government_expenditure_bn','interest_expenditure_bn','government_revenue_bn',
            'maastricht_balance_bn','federal_sector_balance_bn','state_and_municipal_sector_balance_bn',
            'social_security_sector_balance_bn','primary_balance_bn','maastricht_debt_bn','maastricht_debt_pct_gdp'
          ];
          for (const key of required) {
            const a = b.series?.[key];
            if (!Array.isArray(a) || a.length !== expectedYears.length || a.some(v => !Number.isFinite(v))) fail(`Invalid baseline series ${key}`);
          }
          const tolBn = Number(b.validation?.tolerance_bn ?? 0.2) + 1e-9;
          const tolPct = Number(b.validation?.tolerance_pct_points ?? 0.15) + 1e-9;
          for (let i=0;i<expectedYears.length;i++) {
            const year = expectedYears[i];
            const total = b.series.maastricht_balance_bn[i];
            const primary = b.series.primary_balance_bn[i];
            const interest = b.series.interest_expenditure_bn[i];
            if (Math.abs(total - (primary - interest)) > tolBn) fail(`${year}: balance identity failed`);
            const sectors = b.series.federal_sector_balance_bn[i] + b.series.state_and_municipal_sector_balance_bn[i] + b.series.social_security_sector_balance_bn[i];
            if (Math.abs(total - sectors) > tolBn) fail(`${year}: sector identity failed`);
            const debtRatio = b.series.maastricht_debt_bn[i] / b.series.nominal_gdp_bn[i] * 100;
            if (Math.abs(debtRatio - b.series.maastricht_debt_pct_gdp[i]) > tolPct) fail(`${year}: debt ratio identity failed (${debtRatio})`);
            const row = p.rows.find(r => r.year === year);
            if (!row) fail(`${year}: missing in medium-term fiscal path`);
            if (Math.abs(row.nominal_gdp_eur_billion - b.series.nominal_gdp_bn[i]) > 0.001) fail(`${year}: GDP mismatch between baseline and fiscal path`);
            if (Math.abs(row.maastricht_balance_eur_billion - total) > 0.001) fail(`${year}: balance mismatch between baseline and fiscal path`);
            if (!Number.isFinite(row.bridge_to_target_surplus_eur_billion)) fail(`${year}: bridge to +10 missing`);
          }
          if (b.series.maastricht_debt_pct_gdp[5] !== 85.0) fail('2031 BMF debt ratio must remain 85.0 in current baseline');
          console.log('BUD-01 baseline OK: 2026-2031 complete, accounting identities within rounding tolerance, fiscal calculator path synchronized');
          NODE

      - name: Government baseline double-counting contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const fail = msg => { throw new Error(msg); };
          const g = JSON.parse(fs.readFileSync('werk-data/government-baseline-2025-2031.json', 'utf8'));
          const a = g.annual_consolidation_since_2025_mio;
          const n = g.new_measures_2026_2031_mio;
          const s = g.new_measures_sector_net_mio;
          const years7 = [2025,2026,2027,2028,2029,2030,2031];
          const years6 = [2026,2027,2028,2029,2030,2031];
          if (JSON.stringify(a.years) !== JSON.stringify(years7)) fail('Government baseline annual years mismatch');
          if (JSON.stringify(n.years) !== JSON.stringify(years6)) fail('New measures years mismatch');
          if (JSON.stringify(s.years) !== JSON.stringify(years6)) fail('Sector split years mismatch');
          const arrays7 = ['original_2025_package','update_and_concretisation','updated_2025_package','new_measures_since_june_2025','total_consolidation_since_2025','expenditure_side_share_pct','revenue_side_share_pct'];
          for (const key of arrays7) if (!Array.isArray(a[key]) || a[key].length !== 7) fail(`Invalid government annual series ${key}`);
          for (let i=0;i<7;i++) {
            if (Math.abs((a.updated_2025_package[i] + a.new_measures_since_june_2025[i]) - a.total_consolidation_since_2025[i]) > 1) fail(`${years7[i]}: updated package + new measures != total consolidation`);
            if (Math.abs((a.expenditure_side_share_pct[i] + a.revenue_side_share_pct[i]) - 100) > 0.1) fail(`${years7[i]}: expenditure/revenue shares != 100`);
          }
          for (let i=0;i<6;i++) {
            const year = years6[i];
            if (Math.abs((n.consolidation_gross[i] - n.offensive_gross[i]) - n.net_consolidation[i]) > 1) fail(`${year}: gross consolidation - offensive != net`);
            if (Math.abs((n.expenditure_consolidation_gross[i] - n.expenditure_offensive_gross[i]) - n.expenditure_net[i]) > 1) fail(`${year}: expenditure net identity failed`);
            if (Math.abs((n.revenue_consolidation_gross[i] - n.revenue_offensive_gross[i]) - n.revenue_net[i]) > 1) fail(`${year}: revenue net identity failed`);
            if (Math.abs((n.expenditure_net[i] + n.revenue_net[i]) - n.net_consolidation[i]) > 1) fail(`${year}: expenditure net + revenue net != total net`);
            if (Math.abs((s.federal[i] + s.states_and_municipalities[i] + s.social_security[i]) - n.net_consolidation[i]) > 1) fail(`${year}: sector split != total net`);
          }
          if (g.coverage?.gap_base_01_status !== 'partially_closed') fail('GAP-BASE-01 must remain partially closed until all line items are normalised');
          console.log('Government baseline OK: 2025-2031 totals, new-measure nets and sector splits reconcile; GAP-BASE-01 correctly remains partial');
          NODE

      - name: Version regression guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -n 'V70' werk-v71.html; then
            echo 'Unexpected V70 marker found in V71 shell'
            exit 1
          fi
          if grep -n "ribbon.textContent='WERK Österreich · V70" werk-assets/site-v59.js; then
            echo 'Release dashboard still forces V70 ribbon'
            exit 1
          fi
          echo 'No V70 shell regression detected'
