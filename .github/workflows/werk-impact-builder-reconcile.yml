name: WERK Impact Builder Reconcile

on:
  push:
    branches:
      - werk-v49-preview-host
    paths:
      - '.github/workflows/werk-impact-builder-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: werk-v49-preview-host
          fetch-depth: 0
      - name: Patch builder-owned WERK state
        run: python scripts/werk-impact-builder-reconcile-once.py
      - name: Commit reconciliation and remove one-shot helpers
        run: |
          rm scripts/werk-impact-builder-reconcile-once.py
          rm .github/workflows/werk-impact-builder-reconcile.yml
          python - <<'PY'
          from pathlib import Path
          for f in [
            'project-memory/TASK_LEDGER.md',
            'project-memory/STARTED_WORK.md',
            'project-memory/WORK_LOCKS.md',
            'project-memory/OPEN_LOOPS.md',
            'project-memory/DEPENDENCIES.md',
            'project-memory/NEXT_BEST_ACTION.md',
            'project-memory/WERK_IMPACT_SOURCE_BINDING_001_BUILDER_CLAIM.md'
          ]:
              p=Path(f)
              if p.exists(): p.write_text(p.read_text().rstrip()+'\n')
          PY
          git config user.name 'WERK autonomous builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'WERK: reconcile impact source binding builder state'
          git push origin HEAD:werk-v49-preview-host
