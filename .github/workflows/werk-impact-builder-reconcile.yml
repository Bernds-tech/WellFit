name: WERK Impact Builder Reconcile

on:
  push:
    branches:
      - werk-v49-preview-host
    paths:
      - '.github/workflows/werk-impact-builder-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: werk-v49-preview-host
          fetch-depth: 0
      - name: Patch builder-owned WERK state
        run: python scripts/werk-impact-builder-reconcile-once.py
      - name: Commit reconciliation and remove one-shot helpers
        run: |
          rm scripts/werk-impact-builder-reconcile-once.py
          rm .github/workflows/werk-impact-builder-reconcile.yml
          git config user.name 'WERK autonomous builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'WERK: reconcile impact source binding builder state'
          git push origin HEAD:werk-v49-preview-host
