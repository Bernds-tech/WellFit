name: WERK impact bridge reconcile once
on:
  push:
    branches: [werk-v49-preview-host]
    paths: ['.github/workflows/werk-impact-bridge-reconcile-once.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: werk-v49-preview-host
          fetch-depth: 0
      - name: Reconcile API contract, graph and builder state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re

          # API contract: document only the staging behavior that is now actually live.
          p=Path('werk-data/ideenwerk-api-contract.json')
          d=json.loads(p.read_text())
          d['version']='2026-09-21-v17'
          if 'Impact-Bridge' not in d.get('status',''):
              d['status']=d.get('status','').replace('; Produktivfreigabe offen','') + '; versiongebundener IDEENWERK-Impact-Bridge zu bestehenden WERK-Reform-/Rechenartefakten staging-live; Produktivfreigabe offen'
          principle='der Impact-Bridge verknüpft nur hochspezifische Problemsignale mit bereits existierenden WERK-Reform- und Daten-/Rechenvertrags-IDs; er erzeugt keine neue Wirkungszahl, keinen politischen Score und keine Annahme/Ablehnung; bei Versionsdrift wird die alte Zuordnung fail-closed nur als revalidation_required ausgegeben und no_known_mapping ist kein Vollständigkeitsnachweis'
          if principle not in d['principles']: d['principles'].append(principle)
          for ep in d['endpoints']:
              if ep['method']=='GET' and ep['path']=='/status/{public_id}':
                  if 'impact_bridge_check?' not in ep['response']: ep['response'].append('impact_bridge_check?')
                  if 'impact_bridge_check enthält' not in ep['notes']:
                      ep['notes'] += '; impact_bridge_check enthält nach Eintritt in precheck entweder candidate_mapping mit bestehenden reform_ids/data_contract_ids/gate_refs und gebundenen Registry-/Source-Versionen, no_known_mapping ohne Vollständigkeitsbehauptung oder bei Versionsdrift revalidation_required ohne alte Mappings; keine neue Wirkungszahl oder politische Entscheidung'
              if ep['method']=='GET' and ep['path']=='/privacy/export/{public_id}':
                  if 'impact_bridge_check' not in ep['response']: ep['response'].append('impact_bridge_check')
                  if 'Impact-Bridge' not in ep['notes']:
                      ep['notes'] += '; der aktuelle stale-safe Impact-Bridge-Bezug wird als Verfahrens-/Provenienzinformation exportiert, ohne neue Wirkungszahl oder politische Bewertung'
          if not any(j.get('name')=='impact_bridge_check' for j in d.get('internal_jobs',[])):
              d.setdefault('internal_jobs',[]).append({
                'name':'impact_bridge_check','implementation':'staging-live',
                'input':'structured_proposal + immutable submission context + canonical WERK reform/data-contract registries',
                'output':'version-bound candidate reform/data-contract/gate references only, or no_known_mapping',
                'failure':'registry/source version drift returns revalidation_required with no stale mappings; no match never claims completeness; no new fiscal effect or political decision'
              })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')

          # System graph remains IN_PROGRESS until independent Supervisor countercheck,
          # but now records the real staged implementation rather than a hypothetical edge.
          p=Path('werk-data/werk-system-graph.json')
          g=json.loads(p.read_text())
          g['updated']='2026-09-21'
          for n in g['nodes']:
              if n.get('id')=='IDEENWERK-IMPACT':
                  n['state']='IN_PROGRESS'
                  n['builder_state']='IMPLEMENTED_STAGING_AWAITING_COUNTERCHECK'
                  n['implementation']='ideenwerk-backend/sql/037_ideenwerk_impact_bridge.sql'
                  n['registry']='werk-data/ideenwerk-impact-bridge.json'
                  n['staging_migration']='20260920223436 ideenwerk_impact_bridge'
          for e in g['edges']:
              if e.get('to')=='IDEENWERK-IMPACT' and e.get('from') in ('REFORM-REGISTER','CALC-WERK','IDEENWERK-INTAKE'):
                  e['state']='IN_PROGRESS'
                  e['builder_state']='STAGING_LINK_IMPLEMENTED_AWAITING_COUNTERCHECK'
          p.write_text(json.dumps(g,ensure_ascii=False,indent=2)+'\n')

          # Started work: implementation finished by Builder, independent acceptance pending.
          p=Path('project-memory/STARTED_WORK.md'); t=p.read_text()
          pat=r'(?ms)^## WERK-IDEENWERK-IMPACT-BRIDGE-001\n.*?(?=^## |\Z)'
          repl='''## WERK-IDEENWERK-IMPACT-BRIDGE-001
- Started: 2026-09-20 22:31 UTC
- Status: IMPLEMENTED_NOT_VERIFIED
- Risk: R3
- Branch: `werk-v49-preview-host`
- Lock: `LOCK-WERK-IDEENWERK-IMPACT-BRIDGE-001`
- Scope: version-bound citizen/precheck → existing WERK reform/calculation reference bridge; no new fiscal calculation or political recommendation.
- Implemented: canonical registry `werk-data/ideenwerk-impact-bridge.json`; migration `037_ideenwerk_impact_bridge`; private status/privacy-export overlay; stale/no-match negative path; existing V71 status rendering; dedicated Impact Bridge CI.
- Staging: migration `20260920223436 ideenwerk_impact_bridge` active on WERK Österreich Staging. Synthetic SV case mapped only to `SV-01` / `FISCAL-DATA` / `WERK-SV-010|011`; protected status returned the same mapping; forced stale registry version returned `revalidation_required` with empty mappings; synthetic records were cleaned back to zero baseline.
- CI: WERK Impact Bridge Check #2 and WERK Frontend Check #176 succeeded on exact functional head `f5a38a74caf4daf896124b2f606942d1653e2316`.
- Exact next step: independent WERK Supervisor countercheck. Do not rebuild or advance the finishline gate from this Builder claim.

'''
          t,n=re.subn(pat,repl,t,count=1)
          if n!=1: raise SystemExit(f'STARTED_WORK impact section count {n}')
          p.write_text(t)

          p=Path('project-memory/WORK_LOCKS.md'); t=p.read_text()
          pat=r'(?ms)^## LOCK-WERK-IDEENWERK-IMPACT-BRIDGE-001\n.*?(?=^## |\Z)'
          repl='''## LOCK-WERK-IDEENWERK-IMPACT-BRIDGE-001
- Task: WERK-IDEENWERK-IMPACT-BRIDGE-001
- Status: ACTIVE
- Phase: BUILDER_CLAIM_READY_AWAITING_SUPERVISOR
- Risk: R3
- Holder: WERK autonomous builder / no second implementation worker
- Branch: `werk-v49-preview-host`
- Acquired: 2026-09-20 22:31 UTC
- Scope: bounded Impact Bridge registry/runtime/status integration and reversible Staging verification only.
- Builder implementation complete: functional head `f5a38a74caf4daf896124b2f606942d1653e2316`; Staging migration `20260920223436 ideenwerk_impact_bridge`; zero synthetic baseline restored.
- Release condition: independent Supervisor countercheck consumes the Builder claim or records a concrete contradiction. Until then, do not rebuild the same scope.

'''
          t,n=re.subn(pat,repl,t,count=1)
          if n!=1: raise SystemExit(f'WORK_LOCKS impact section count {n}')
          p.write_text(t)

          p=Path('project-memory/TASK_LEDGER.md'); t=p.read_text()
          pat=r'(?ms)^## WERK-IDEENWERK-IMPACT-BRIDGE-001\n.*?(?=^## |\Z)'
          repl='''## WERK-IDEENWERK-IMPACT-BRIDGE-001
- Date: 2026-09-20
- Status: IMPLEMENTED_NOT_VERIFIED
- Risk: R3
- Goal: connect IDEENWERK citizen problems to existing WERK reform/calculation artifacts through a deterministic version-bound reference bridge without duplicating calculations.
- Result: five canonical mapping families are bound to existing reform/data-contract/gate IDs; migration 037 runs the mapping at precheck, protected status/export expose only current provenance, stale versions fail closed to revalidation_required, no-match is explicitly non-complete, and V71 reuses the existing protected status surface.
- CI: WERK Impact Bridge Check #2 + WERK Frontend Check #176 green on functional head `f5a38a74caf4daf896124b2f606942d1653e2316`.
- Staging: migration `20260920223436 ideenwerk_impact_bridge` active; synthetic candidate/status/stale tests passed; all synthetic submission/structured/review/audit/bridge/status-access rows returned to zero baseline.
- Boundary: no newly calculated effect, saving, cost, forecast, political score or automatic acceptance/rejection. No-match does not establish absence of a relevant WERK artifact.
- Dependency: `WERK-DEP-IDEENWERK-IMPACT-001`; loop `WERK-LOOP-IMPACT-BRIDGE-001` remains open pending independent countercheck.
- Next: Supervisor countercheck; Builder must not self-verify or raise the finishline gate.

'''
          t,n=re.subn(pat,repl,t,count=1)
          if n!=1: raise SystemExit(f'TASK_LEDGER impact section count {n}')
          p.write_text(t)

          # Existing open loop/dependency stay open, but state is now precise.
          p=Path('project-memory/OPEN_LOOPS.md'); t=p.read_text()
          pat=r'(?ms)^## WERK-LOOP-IMPACT-BRIDGE-001\n.*?(?=^## |\Z)'
          repl='''## WERK-LOOP-IMPACT-BRIDGE-001
- Status: IMPLEMENTED_AWAITING_COUNTERCHECK
- Updated: 2026-09-20 22:36 UTC
- Gap originally identified: IDEENWERK and verified WERK calculation/reform artifacts existed without an end-to-end version-bound connection.
- Builder result: canonical registry + migration 037 now map high-specificity citizen problem signals only to existing reform/data-contract/gate IDs; private status/export and existing V71 status surface expose the current provenance; stale versions fail closed; no-match is explicitly non-complete.
- Evidence claim: functional head `f5a38a74caf4daf896124b2f606942d1653e2316`; WERK Impact Bridge Check #2 and Frontend Check #176 green; Staging migration `20260920223436 ideenwerk_impact_bridge`; synthetic candidate/status/stale verification passed and zero baseline restored.
- Boundary: no parallel calculator, no new fiscal effect and no political recommendation/decision.
- Next: independent Supervisor countercheck. Close only after version binding, negative/stale path, existing UI reuse and staging evidence are independently accepted.

'''
          t,n=re.subn(pat,repl,t,count=1)
          if n!=1: raise SystemExit(f'OPEN_LOOPS impact section count {n}')
          p.write_text(t)

          p=Path('project-memory/DEPENDENCIES.md'); t=p.read_text()
          pat=r'(?ms)^## WERK-DEP-IDEENWERK-IMPACT-001\n.*?(?=^## |\Z)'
          repl='''## WERK-DEP-IDEENWERK-IMPACT-001
- From: IDEENWERK citizen precheck / problem cluster.
- Requires: current verified competence/legal path, existing-measure path, reform identifiers and existing WERK calculation/data artifacts.
- Type: cross-component integration.
- Status: IMPLEMENTED_AWAITING_COUNTERCHECK
- Updated: 2026-09-20 22:36 UTC.
- Rule: IDEENWERK references and reuses existing WERK calculation/reform artifacts instead of creating parallel calculations. Links expose applicable model/reform IDs, provenance and open gates; conditional/illustrative calculations are never converted into verified fiscal effects.
- Builder evidence: `werk-data/ideenwerk-impact-bridge.json`, migration 037, functional head `f5a38a74caf4daf896124b2f606942d1653e2316`, WERK Impact Bridge Check #2, Frontend Check #176, Staging migration `20260920223436 ideenwerk_impact_bridge`, reversible synthetic verification and zero baseline.
- Close when: independent Supervisor countercheck accepts the version-bound end-to-end bridge and negative/stale safeguards.

'''
          t,n=re.subn(pat,repl,t,count=1)
          if n!=1: raise SystemExit(f'DEPENDENCIES impact section count {n}')
          p.write_text(t)

          p=Path('project-memory/NEXT_BEST_ACTION.md')
          p.write_text('''# WERK Next Best Action

- Project: `WERK Österreich`
- Selected action: `WERK-IDEENWERK-IMPACT-BRIDGE-001`
- Catalog entry: `NBA-WERK-IMPACT-BRIDGE`
- Status: `AWAITING_INDEPENDENT_COUNTERCHECK`
- Risk: `R3`
- Gate: `impact_bridge`
- Title: Bürgerideen mit bestehenden WERK-Rechenmodellen und Reformakten verbinden

## Current state
The bounded Builder implementation is complete on functional head `f5a38a74caf4daf896124b2f606942d1653e2316`. WERK Impact Bridge Check #2 and WERK Frontend Check #176 are green. Staging migration `20260920223436 ideenwerk_impact_bridge` is active; protected status and stale-version behavior were tested with a reversible synthetic case and the Staging baseline was cleaned to zero.

## Exact next step
Independent WERK Supervisor countercheck. The Builder must not rebuild this scope, self-verify it, release the finishline gate or advance to AI/expert work until the Supervisor either records COUNTERCHECKED evidence or a concrete contradiction/follow-up.

## Boundary retained
No duplicated calculator, no unsupported numeric effect, no political score/recommendation, no automatic acceptance/rejection, no completeness claim from `no_known_mapping`, no production release.
''')
          PY

          cat > project-memory/WERK_IDEENWERK_IMPACT_BRIDGE_001_BUILDER_CLAIM.md <<'EOF'
          # WERK IDEENWERK Impact Bridge 001 — Builder Claim

          Status: IMPLEMENTED_NOT_VERIFIED  
          Risk: R3  
          Functional head: `f5a38a74caf4daf896124b2f606942d1653e2316`  
          Staging migration: `20260920223436 ideenwerk_impact_bridge`

          ## Claim

          The Builder implemented the previously missing connection `citizen idea/precheck -> existing WERK reform and calculation/data-contract artifacts` without creating a parallel calculator. The canonical registry contains only existing reform IDs, data-contract IDs, gate references and artifact provenance. Runtime migration 037 maps bounded high-specificity problem signals to those references, never computes a new fiscal effect and never makes a political acceptance/rejection or recommendation.

          ## Code evidence

          - `werk-data/ideenwerk-impact-bridge.json` version `2026-09-21-v1`, source-bound to `reforms.json` `2026-09-06-v5` and Data Contract Registry `2026-09-07-v17`.
          - `ideenwerk-backend/sql/037_ideenwerk_impact_bridge.sql`: RLS-protected check table, precheck trigger, audit trail, protected status/export overlay and stale-version fail-closed behavior.
          - `ideenwerk-backend/scripts/impact-bridge-contract.mjs`: verifies canonical reform/data-contract/artifact IDs and exact SQL runtime-map parity.
          - `ideenwerk-backend/scripts/impact-bridge-smoke.mjs`: denies anon/authenticated direct access, proves SV candidate mapping, proves no new amount/effect field, forces stale-version revalidation and proves non-complete no-match behavior.
          - `werk-assets/site-ideenwerk-v2.js`: reuses the existing V71 protected status surface; no parallel page.

          ## CI evidence

          - WERK Impact Bridge Check #2 on exact functional head: SUCCESS. Portable migration, idempotency, canonical registry parity and DB stale/negative smoke all passed.
          - WERK Frontend Check #176 on exact functional head: SUCCESS, including V71 structural/policy and JS/JSON checks.

          ## Reversible Staging evidence

          WERK Österreich Staging migration `20260920223436 ideenwerk_impact_bridge` applied successfully. A synthetic employee-SV submission transitioned to `precheck` and produced exactly `IMPACT-SV-EMPLOYEE -> SV-01 -> FISCAL-DATA -> WERK-SV-010/WERK-SV-011`. The token-protected private status returned the same current bridge. `anon` and `authenticated` had no direct table SELECT. After forcing a stale registry version on the synthetic row, the public internal contract returned `revalidation_required` with an empty mapping array rather than stale references. Synthetic submission, structured proposal, review task, audit events, bridge check and status-access rows were then removed; all returned to the zero-data Staging baseline.

          ## Explicit non-claims

          - No new cost, saving, revenue, fiscal effect or forecast was calculated.
          - A candidate mapping is not a political score, recommendation, acceptance or rejection.
          - `no_known_mapping` does not prove that no relevant WERK artifact exists.
          - This is Staging implementation evidence, not production acceptance.
          - The `impact_bridge` Finishline gate remains unchanged until independent Supervisor countercheck.

          ## Required next actor

          WERK Supervisor: independently countercheck exact code/CI/Staging evidence, then either record COUNTERCHECKED/receipt and release the dependency/lock or record a concrete contradiction/open follow-up.
          EOF

          # remove indentation introduced by heredoc inside YAML
          sed -i 's/^          //' project-memory/WERK_IDEENWERK_IMPACT_BRIDGE_001_BUILDER_CLAIM.md
          git diff --check
          git config user.name 'werk-autonomous-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add werk-data/ideenwerk-api-contract.json werk-data/werk-system-graph.json project-memory/STARTED_WORK.md project-memory/WORK_LOCKS.md project-memory/TASK_LEDGER.md project-memory/OPEN_LOOPS.md project-memory/DEPENDENCIES.md project-memory/NEXT_BEST_ACTION.md project-memory/WERK_IDEENWERK_IMPACT_BRIDGE_001_BUILDER_CLAIM.md
          git commit -m 'reconcile: record staged IDEENWERK impact bridge claim'
          git push origin HEAD:werk-v49-preview-host
